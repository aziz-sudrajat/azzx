name: AZZX CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh update-local.sh selftest.sh
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mock AI integration
        env:
          PYTHONPATH: .
        run: env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy -u ALL_PROXY -u all_proxy -u NO_PROXY -u no_proxy python tests/integration_mock_ai.py
      - name: CLI smoke tests
        run: python azzx_cli.py --version && python azzx_cli.py schedule --help && python azzx_cli.py agent --roles && python azzx_cli.py recall --help >/dev/null && python azzx_cli.py skills --help >/dev/null
